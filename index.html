<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BabylonPlanets — Space Arena map builder</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05070d;
        color: #cdd6e4;
        font: 13px/1.45 system-ui, sans-serif;
      }
      #app {
        display: flex;
        height: 100%;
      }
      #sidebar {
        width: 340px;
        flex: none;
        overflow-y: auto;
        padding: 10px 12px 24px;
        background: #0b0f1a;
        border-right: 1px solid #1c2436;
        box-sizing: border-box;
      }
      #viewport {
        flex: 1;
        min-width: 0;
      }
      #render-canvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }
      .app-title {
        font-size: 15px;
        margin: 4px 0 10px;
        color: #e8edf7;
      }
      .panel-section {
        border: 1px solid #1c2436;
        border-radius: 6px;
        margin-bottom: 10px;
        padding: 6px 8px;
      }
      .panel-section > summary {
        cursor: pointer;
        font-weight: 600;
        color: #9fb4d8;
        margin: 2px 0 4px;
      }
      .field {
        display: inline-flex;
        flex-direction: column;
        margin: 3px 6px 3px 0;
      }
      .field-label {
        font-size: 11px;
        color: #7b8aa5;
      }
      .field input {
        width: 90px;
        background: #121828;
        color: #dbe4f2;
        border: 1px solid #26314a;
        border-radius: 4px;
        padding: 3px 5px;
      }
      .field input[type="color"] {
        padding: 0;
        height: 26px;
      }
      .row {
        border-top: 1px dashed #1c2436;
        padding: 4px 0;
      }
      .row:first-of-type {
        border-top: none;
      }
      button {
        background: #1a2740;
        color: #dbe4f2;
        border: 1px solid #2c3d61;
        border-radius: 4px;
        padding: 4px 10px;
        margin: 4px 6px 2px 0;
        cursor: pointer;
      }
      button:hover {
        background: #223354;
      }
      button.primary {
        background: #1f4d80;
        border-color: #2f6cad;
      }
      button.danger {
        background: #4d1f2a;
        border-color: #7a2e3f;
      }
      .status {
        font-size: 11px;
        color: #7b8aa5;
        margin-top: 4px;
      }
      .manifest {
        font-size: 11px;
        color: #8fd0a0;
        background: #0d1420;
        padding: 6px;
        border-radius: 4px;
        white-space: pre-wrap;
      }
      .error {
        font-size: 11px;
        color: #ff8a9a;
        white-space: pre-wrap;
      }
      .error:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar"></aside>
      <main id="viewport"><canvas id="render-canvas"></canvas></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
